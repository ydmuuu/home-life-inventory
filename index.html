<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<link rel="manifest" href="manifest.webmanifest">
<title>我的家 · 生活管理</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d1d1f;--muted:#777;--line:#e7e8ec;--blue:#2f6df6;--soft:#f1f3f7;--green:#2d7a46;--red:#b42318;--orange:#a15c00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:760px;margin:auto;padding:14px 14px 96px}.header{position:sticky;top:0;z-index:20;background:rgba(246,247,249,.95);backdrop-filter:blur(12px);padding:8px 0 12px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}h1{font-size:24px;margin:0 0 4px}.sub{font-size:12px;color:var(--muted)}.pill{font-size:11px;padding:6px 9px;border-radius:999px;background:#fff;border:1px solid var(--line);white-space:nowrap}.search{margin-top:12px}.search input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:#fff;font-size:15px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.filters select{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px;background:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 7px;text-align:center}.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:var(--muted)}.title{font-size:15px;font-weight:750;margin:18px 2px 10px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:10px}.item{display:grid;grid-template-columns:68px 1fr 20px;gap:12px;align-items:center}.photo{width:68px;height:68px;border-radius:14px;background:linear-gradient(135deg,#edf1ff,#f7efff);display:grid;place-items:center;font-size:31px}.item h3{margin:0 0 5px;font-size:16px}.meta{font-size:12px;color:var(--muted);line-height:1.55}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.badge{font-size:11px;background:var(--soft);padding:4px 7px;border-radius:999px}.badge.green{color:var(--green);background:#eef8f1}.badge.red{color:var(--red);background:#fff0ef}.badge.orange{color:var(--orange);background:#fff6e8}.chev{font-size:22px;color:#aaa}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.box b{font-size:22px;display:block;margin-bottom:3px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row .left{min-width:0}.row strong{font-size:14px}.row .right{text-align:right;white-space:nowrap;font-size:13px}.pricegood{color:var(--green);font-weight:700}.pricelow{color:var(--blue);font-weight:700}.empty{text-align:center;color:var(--muted);padding:44px 10px}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.98);border-top:1px solid var(--line)}.bottom .inner{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(6,1fr);padding:6px 4px max(7px,env(safe-area-inset-bottom))}.nav{border:0;background:transparent;min-height:58px;color:#666;font-size:10px;touch-action:manipulation}.nav span{display:block;font-size:20px;margin-bottom:3px;pointer-events:none}.nav.active{color:var(--blue);font-weight:750}.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.36);display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px max(24px,env(safe-area-inset-bottom))}.hero{height:180px;border-radius:18px;background:linear-gradient(135deg,#edf1ff,#f7efff);display:grid;place-items:center;font-size:68px}.sheet h2{margin:14px 0 4px}.detailrow{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}.detailrow span:first-child{color:var(--muted);font-size:12px}.detailrow span:last-child{text-align:right;font-size:13px}.close{width:100%;border:0;background:#111;color:white;padding:13px;border-radius:14px;margin-top:16px}.section-note{font-size:12px;color:var(--muted);margin-top:-3px;margin-bottom:10px}.warn{background:#fff7ed;border:1px solid #fed7aa;border-radius:16px;padding:12px;color:#9a3412;font-size:12px;line-height:1.6}@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.bottom .inner{grid-template-columns:repeat(6,1fr)}.nav{font-size:9px}.nav span{font-size:19px}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="top"><div><h1 id="appName">我的家 · 生活管理</h1><div class="sub">库存 · 位置 · 喜好 · 回购 · 价格 · 记账</div></div><div class="pill" id="updated">载入中…</div></div>
    <div class="search"><input id="q" placeholder="搜索物品、品牌、位置、商家…"></div>
    <div class="filters" id="filters"><select id="cat"><option value="全部">全部类别</option></select><select id="status"><option value="全部">全部状态</option><option value="有库存">有库存</option><option value="需补货">需补货</option><option value="不回购">不回购</option></select></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="title" id="pageTitle">我的物品</div>
  <div class="section-note" id="pageNote"></div>
  <main id="main"><div class="empty">正在读取数据…</div></main>
</div>

<nav class="bottom"><div class="inner">
<button class="nav active" data-tab="inventory"><span>🏠</span>库存</button>
<button class="nav" data-tab="shopping"><span>🛒</span>待购买</button>
<button class="nav" data-tab="prices"><span>🏷️</span>价格</button>
<button class="nav" data-tab="ledger"><span>💳</span>账本</button>
<button class="nav" data-tab="nobuy"><span>🚫</span>不回购</button>
<button class="nav" data-tab="review"><span>📊</span>复盘</button>
</div></nav>

<div class="modal" id="modal"><div class="sheet">
<div class="hero" id="dEmoji">📦</div><h2 id="dName">物品</h2><div class="sub" id="dBrand"></div>
<div id="detailRows"></div><button class="close" id="closeBtn">关闭</button>
</div></div>

<script>
let db={items:[],purchaseHistory:[],consumptionHistory:[],ledger:[],app:{}};let tab='inventory';
const fmt=n=>'₩'+Number(n||0).toLocaleString('ko-KR');const byId=id=>db.items.find(x=>x.id===id);const stars=n=>'★'.repeat(Number(n||0))+'☆'.repeat(Math.max(0,5-Number(n||0)));
async function load(){try{const r=await fetch('data.json?v='+Date.now());db=await r.json();document.getElementById('appName').textContent=db.app?.name||'我的家 · 生活管理';document.getElementById('updated').textContent='更新 '+(db.app?.updatedAt||'');buildCategories();render()}catch(e){document.getElementById('main').innerHTML='<div class="warn">数据载入失败。请确认 data.json 与 index.html 位于同一仓库根目录。</div>'}}
function buildCategories(){const s=document.getElementById('cat');[...new Set(db.items.map(x=>x.category).filter(Boolean))].sort().forEach(c=>{const o=document.createElement('option');o.textContent=c;o.value=c;s.appendChild(o)})}
function renderStats(){const items=db.items||[];const low=items.filter(x=>Number(x.quantity)<=Number(x.minQuantity)).length;const no=items.filter(x=>x.repurchase==='不会').length;const spent=(db.ledger||[]).filter(x=>x.type==='支出').reduce((a,b)=>a+Number(b.amount||0),0);document.getElementById('stats').innerHTML=`<div class="stat"><b>${items.length}</b><span>物品种类</span></div><div class="stat"><b>${low}</b><span>需要补货</span></div><div class="stat"><b>${no}</b><span>不再回购</span></div><div class="stat"><b>${fmt(spent)}</b><span>累计记录支出</span></div>`}
function filteredItems(mode){const q=document.getElementById('q').value.trim().toLowerCase();const cat=document.getElementById('cat').value;const status=document.getElementById('status').value;let a=[...(db.items||[])];if(q)a=a.filter(x=>[x.name,x.brand,x.location,x.category,x.review].join(' ').toLowerCase().includes(q));if(cat!=='全部')a=a.filter(x=>x.category===cat);if(status==='有库存')a=a.filter(x=>Number(x.quantity)>0);if(status==='需补货')a=a.filter(x=>Number(x.quantity)<=Number(x.minQuantity));if(status==='不回购')a=a.filter(x=>x.repurchase==='不会');if(mode==='shopping')a=a.filter(x=>Number(x.quantity)<=Number(x.minQuantity));if(mode==='nobuy')a=a.filter(x=>x.repurchase==='不会');return a}
function itemCard(x){const low=Number(x.quantity)<=Number(x.minQuantity);return `<div class="card item" data-id="${x.id}"><div class="photo">${x.emoji||'📦'}</div><div><h3>${x.name}</h3><div class="meta">${x.brand||''} · ${x.quantity}${x.unit||''}<br>📍 ${x.location||'未记录位置'}</div><div class="badges"><span class="badge">${x.category||'其他'}</span><span class="badge">${stars(x.rating)}</span><span class="badge ${x.repurchase==='不会'?'red':x.repurchase==='会'?'green':'orange'}">回购：${x.repurchase||'未决定'}</span>${low?'<span class="badge red">需补货</span>':''}</div></div><div class="chev">›</div></div>`}
function renderInventory(mode='inventory'){const a=filteredItems(mode);document.getElementById('pageTitle').textContent=mode==='shopping'?'待购买':'我的物品';document.getElementById('pageNote').textContent=mode==='shopping'?'当前库存达到或低于最低库存的物品。':'点击物品可查看位置、开始使用日期、使用感受和价格历史。';document.getElementById('main').innerHTML=a.length?a.map(itemCard).join(''):'<div class="empty">没有符合条件的物品</div>';bindCards()}
function renderNoBuy(){const a=filteredItems('nobuy');document.getElementById('pageTitle').textContent='不回购物品';document.getElementById('pageNote').textContent='以后看到这些商品时，可以先回来确认过去为什么不喜欢。';document.getElementById('main').innerHTML=a.length?a.map(itemCard).join(''):'<div class="empty">目前没有不回购物品</div>';bindCards()}
function priceSummary(item){const h=(db.purchaseHistory||[]).filter(p=>p.itemId===item.id).sort((a,b)=>a.date.localeCompare(b.date));if(!h.length)return null;const min=Math.min(...h.map(x=>Number(x.unitPrice||0)));const last=h[h.length-1];return {min,last,h}}
function renderPrices(){document.getElementById('pageTitle').textContent='价格档案';document.getElementById('pageNote').textContent='按每次实际购入单价比较；同一商品规格变化时要单独记录规格。';const rows=(db.items||[]).map(i=>[i,priceSummary(i)]).filter(x=>x[1]);document.getElementById('main').innerHTML=rows.length?rows.map(([i,p])=>`<div class="card"><div class="row"><div class="left"><strong>${i.name} · ${i.brand||''}</strong><div class="meta">最近 ${p.last.date} · ${p.last.store||''} · ${p.last.spec||''}</div></div><div class="right"><div>${fmt(p.last.unitPrice)}/${p.last.unit||i.unit||'件'}</div><div class="${Number(p.last.unitPrice)===p.min?'pricelow':'pricegood'}">历史最低 ${fmt(p.min)}</div></div></div>${p.h.slice().reverse().map(x=>`<div class="row"><div class="left"><span class="meta">${x.date} · ${x.store||''}</span></div><div class="right">${fmt(x.unitPrice)}</div></div>`).join('')}</div>`).join(''):'<div class="empty">还没有价格记录</div>'}
function renderLedger(){document.getElementById('pageTitle').textContent='账本';document.getElementById('pageNote').textContent='你告诉我的每笔支出都会整理到这里；购买物品的支出可与库存记录关联。';const l=[...(db.ledger||[])].sort((a,b)=>b.date.localeCompare(a.date));const total=l.filter(x=>x.type==='支出').reduce((s,x)=>s+Number(x.amount||0),0);document.getElementById('main').innerHTML=`<div class="grid2"><div class="box"><b>${fmt(total)}</b><span class="sub">累计记录支出</span></div><div class="box"><b>${l.length}</b><span class="sub">账目笔数</span></div></div><div class="card" style="margin-top:10px">${l.map(x=>`<div class="row"><div class="left"><strong>${x.category}${x.subcategory?' · '+x.subcategory:''}</strong><div class="meta">${x.date} · ${x.merchant||''}${x.note?' · '+x.note:''}</div></div><div class="right">-${fmt(x.amount)}</div></div>`).join('')||'<div class="empty">还没有账目</div>'}</div>`}
function renderReview(){document.getElementById('pageTitle').textContent='消费复盘';document.getElementById('pageNote').textContent='以后数据积累后，这里会逐渐反映你的消耗速度、回购偏好和价格判断。';const items=db.items||[];const liked=items.filter(x=>Number(x.rating)>=4&&x.repurchase==='会').length;const no=items.filter(x=>x.repurchase==='不会').length;const used=(db.consumptionHistory||[]).reduce((s,x)=>s+Number(x.quantity||0),0);const spendBy={};(db.ledger||[]).forEach(x=>{if(x.type==='支出')spendBy[x.category]=(spendBy[x.category]||0)+Number(x.amount||0)});const sorted=Object.entries(spendBy).sort((a,b)=>b[1]-a[1]);document.getElementById('main').innerHTML=`<div class="grid2"><div class="box"><b>${used}</b><span class="sub">累计用完数量</span></div><div class="box"><b>${liked}</b><span class="sub">喜欢并会回购</span></div><div class="box"><b>${no}</b><span class="sub">明确不回购</span></div><div class="box"><b>${sorted.length?sorted[0][0]:'—'}</b><span class="sub">当前最高支出类别</span></div></div><div class="card" style="margin-top:10px"><strong>支出分类</strong>${sorted.map(([k,v])=>`<div class="row"><span>${k}</span><span>${fmt(v)}</span></div>`).join('')||'<div class="empty">暂无数据</div>'}</div>`}
function bindCards(){document.querySelectorAll('[data-id]').forEach(c=>c.addEventListener('click',()=>openDetail(c.dataset.id)))}
function openDetail(id){const x=byId(id);if(!x)return;const p=priceSummary(x);document.getElementById('dEmoji').textContent=x.emoji||'📦';document.getElementById('dName').textContent=x.name;document.getElementById('dBrand').textContent=x.brand||'';const rows=[['类别',x.category],['当前库存',`${x.quantity}${x.unit||''}（最低 ${x.minQuantity}）`],['存放位置',x.location],['开始使用',x.startedAt||'未记录'],['喜欢程度',stars(x.rating)],['是否回购',x.repurchase||'未决定'],['使用感受',x.review||'未记录'],['最近购入价',p?fmt(p.last.unitPrice):'未记录'],['历史最低价',p?fmt(p.min):'未记录']];document.getElementById('detailRows').innerHTML=rows.map(r=>`<div class="detailrow"><span>${r[0]}</span><span>${r[1]||'—'}</span></div>`).join('');document.getElementById('modal').classList.add('show')}
function render(){renderStats();document.getElementById('filters').style.display=['inventory','shopping','nobuy'].includes(tab)?'grid':'none';if(tab==='inventory')renderInventory();if(tab==='shopping')renderInventory('shopping');if(tab==='prices')renderPrices();if(tab==='ledger')renderLedger();if(tab==='nobuy')renderNoBuy();if(tab==='review')renderReview()}
document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();tab=b.dataset.tab;document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}));document.getElementById('q').addEventListener('input',render);document.getElementById('cat').addEventListener('change',render);document.getElementById('status').addEventListener('change',render);document.getElementById('closeBtn').addEventListener('click',()=>document.getElementById('modal').classList.remove('show'));document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show')});load()});
</script>
</body>
</html>
