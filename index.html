<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><link rel="manifest" href="manifest.webmanifest"><title>我的家 · 生活管理</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d1d1f;--muted:#777;--line:#e7e8ec;--blue:#2f6df6;--soft:#f1f3f7;--green:#2d7a46;--red:#b42318;--orange:#a15c00}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:760px;margin:auto;padding:14px 14px 96px}.header{position:sticky;top:0;z-index:20;background:rgba(246,247,249,.95);backdrop-filter:blur(12px);padding:8px 0 12px}.top{display:flex;justify-content:space-between;gap:12px}h1{font-size:24px;margin:0 0 4px}.sub{font-size:12px;color:var(--muted)}.pill{font-size:11px;padding:6px 9px;border-radius:999px;background:#fff;border:1px solid var(--line)}.search{margin-top:12px}.search input,.filters select{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.stats,.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}.stat,.box,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px}.stat{text-align:center}.stat b,.box b{font-size:20px;display:block}.stat span,.section-note{font-size:11px;color:var(--muted)}.title{font-size:15px;font-weight:750;margin:18px 2px 8px}.item{display:grid;grid-template-columns:58px 1fr 18px;gap:12px;align-items:center}.photo{width:58px;height:58px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:28px}.meta{font-size:12px;color:var(--muted);line-height:1.55}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.badge{font-size:11px;background:var(--soft);padding:4px 7px;border-radius:999px}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.right{text-align:right;white-space:nowrap}.money{font-weight:750}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:30}.bottom .inner{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(6,1fr)}.nav{border:0;background:transparent;min-height:58px;color:#666;font-size:10px}.nav span{display:block;font-size:20px}.nav.active{color:var(--blue);font-weight:750}.empty{text-align:center;color:var(--muted);padding:40px 10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.36);display:none;align-items:flex-end;z-index:60}.modal.show{display:flex}.sheet{width:min(760px,100%);margin:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px 26px;max-height:90vh;overflow:auto}.detailrow{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}.close{width:100%;border:0;background:#111;color:#fff;padding:13px;border-radius:14px;margin-top:16px}@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<div class="app"><div class="header"><div class="top"><div><h1 id="appName">我的家 · 生活管理</h1><div class="sub">库存 · 价格 · 订阅 · 记账 · 消费复盘</div></div><div class="pill" id="updated">载入中…</div></div><div class="search"><input id="q" placeholder="搜索物品、品牌、位置、商家…"></div><div class="filters" id="filters"><select id="cat"><option value="全部">全部类别</option></select><select id="status"><option value="全部">全部状态</option><option value="有库存">有库存</option><option value="需补货">需补货</option><option value="不回购">不回购</option></select></div></div><div class="stats" id="stats"></div><div class="title" id="pageTitle">我的物品</div><div class="section-note" id="pageNote"></div><main id="main"></main></div>
<nav class="bottom"><div class="inner"><button class="nav active" data-tab="inventory"><span>🏠</span>库存</button><button class="nav" data-tab="shopping"><span>🛒</span>待购买</button><button class="nav" data-tab="prices"><span>🏷️</span>价格</button><button class="nav" data-tab="ledger"><span>💳</span>账本</button><button class="nav" data-tab="nobuy"><span>🚫</span>不回购</button><button class="nav" data-tab="review"><span>📊</span>复盘</button></div></nav>
<div class="modal" id="modal"><div class="sheet"><h2 id="dName"></h2><div class="sub" id="dBrand"></div><div id="detailRows"></div><button class="close" id="closeBtn">关闭</button></div></div>
<script>
let db={items:[],purchaseHistory:[],consumptionHistory:[],subscriptions:[],ledger:[],app:{}},tab='inventory';
const money=(n,c='KRW')=>c==='USD'?'US$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2}):'₩'+Number(n||0).toLocaleString('ko-KR');const byId=id=>(db.items||[]).find(x=>x.id===id);const stars=n=>n?('★'.repeat(Number(n))+'☆'.repeat(Math.max(0,5-Number(n)))):'未评分';
async function load(){const r=await fetch('data.json?v='+Date.now());db=await r.json();appName.textContent=db.app?.name||'我的家 · 生活管理';updated.textContent='更新 '+(db.app?.updatedAt||'');[...new Set((db.items||[]).map(x=>x.category).filter(Boolean))].sort().forEach(c=>cat.add(new Option(c,c)));render()}
function totals(){const out={};(db.ledger||[]).filter(x=>x.type==='支出').forEach(x=>{const c=x.currency||'KRW';out[c]=(out[c]||0)+Number(x.amount||0)});return out}
function renderStats(){const t=totals(),items=db.items||[],low=items.filter(x=>Number(x.quantity)<=Number(x.minQuantity)&&x.category!=='软件订阅').length;stats.innerHTML=`<div class="stat"><b>${items.length}</b><span>记录项目</span></div><div class="stat"><b>${low}</b><span>需要补货</span></div><div class="stat"><b>${money(t.KRW||0,'KRW')}</b><span>累计韩元支出</span></div><div class="stat"><b>${money(t.USD||0,'USD')}</b><span>累计美元支出</span></div>`}
function filtered(mode){const s=q.value.trim().toLowerCase(),c=cat.value,st=status.value;let a=[...(db.items||[])];if(s)a=a.filter(x=>[x.name,x.brand,x.location,x.category,x.review].join(' ').toLowerCase().includes(s));if(c!=='全部')a=a.filter(x=>x.category===c);if(st==='有库存')a=a.filter(x=>Number(x.quantity)>0);if(st==='需补货')a=a.filter(x=>Number(x.quantity)<=Number(x.minQuantity));if(st==='不回购')a=a.filter(x=>x.repurchase==='不会');if(mode==='shopping')a=a.filter(x=>x.category!=='软件订阅'&&Number(x.quantity)<=Number(x.minQuantity));if(mode==='nobuy')a=a.filter(x=>x.repurchase==='不会');return a}
function card(x){return `<div class="card item" data-id="${x.id}"><div class="photo">${x.emoji||'📦'}</div><div><strong>${x.name}</strong><div class="meta">${x.brand||''}${x.quantity!=null?' · '+x.quantity+(x.unit||''):''}<br>📍 ${x.location||'未记录位置'}</div><div class="badges"><span class="badge">${x.category||'其他'}</span><span class="badge">${x.status||''}</span></div></div><div>›</div></div>`}
function bind(){document.querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>openDetail(e.dataset.id))}
function inventory(mode='inventory'){const a=filtered(mode);pageTitle.textContent=mode==='shopping'?'待购买':'我的物品';pageNote.textContent=mode==='shopping'?'库存达到或低于最低库存的物品。':'点击项目可查看详细记录。';main.innerHTML=a.length?a.map(card).join(''):'<div class="empty">暂无记录</div>';bind()}
function prices(){pageTitle.textContent='价格档案';pageNote.textContent='按实际购买单价记录。';const rows=(db.purchaseHistory||[]).slice().reverse();main.innerHTML=rows.length?rows.map(p=>{const i=byId(p.itemId)||{};return `<div class="card row"><div><strong>${i.name||'商品'}</strong><div class="meta">${p.date} · ${p.store||'未记录商家'} · ${p.spec||''}</div></div><div class="right money">${money(p.unitPrice,p.currency||'KRW')}/${p.unit||i.unit||'件'}</div></div>`}).join(''):'<div class="empty">还没有价格记录</div>'}
function ledger(){pageTitle.textContent='账本';pageNote.textContent='不同币种分开统计，不做未经确认的汇率换算。';const l=[...(db.ledger||[])].sort((a,b)=>b.date.localeCompare(a.date)),t=totals();main.innerHTML=`<div class="grid2"><div class="box"><b>${money(t.KRW||0,'KRW')}</b><span class="sub">韩元支出</span></div><div class="box"><b>${money(t.USD||0,'USD')}</b><span class="sub">美元支出</span></div></div><div class="card">${l.map(x=>`<div class="row"><div><strong>${x.category}${x.subcategory?' · '+x.subcategory:''}</strong><div class="meta">${x.date}${x.merchant?' · '+x.merchant:''}${x.paymentMethod?' · '+x.paymentMethod:''}${x.note?'<br>'+x.note:''}</div></div><div class="right money">-${money(x.amount,x.currency||'KRW')}</div></div>`).join('')||'<div class="empty">还没有账目</div>'}</div>`}
function noBuy(){const a=filtered('nobuy');pageTitle.textContent='不回购物品';pageNote.textContent='明确记录为不再回购的物品。';main.innerHTML=a.length?a.map(card).join(''):'<div class="empty">目前没有不回购物品</div>';bind()}
function review(){pageTitle.textContent='消费复盘';pageNote.textContent='按币种分开查看当前累计支出。';const t=totals(),subs=db.subscriptions||[];main.innerHTML=`<div class="grid2"><div class="box"><b>${money(t.KRW||0,'KRW')}</b><span class="sub">累计韩元支出</span></div><div class="box"><b>${money(t.USD||0,'USD')}</b><span class="sub">累计美元支出</span></div><div class="box"><b>${subs.filter(x=>x.status==='active').length}</b><span class="sub">进行中订阅</span></div><div class="box"><b>${(db.consumptionHistory||[]).length}</b><span class="sub">消耗记录</span></div></div>${subs.length?'<div class="card"><strong>固定订阅</strong>'+subs.map(s=>`<div class="row"><div><strong>${s.name}</strong><div class="meta">${s.startDate}开始 · ${s.paymentMethod||''}</div></div><div class="right money">${money(s.amount,s.currency)}/月</div></div>`).join('')+'</div>':''}`}
function openDetail(id){const x=byId(id);if(!x)return;dName.textContent=x.name;dBrand.textContent=x.brand||'';const rows=[['类别',x.category],['状态',x.status],['数量',`${x.quantity}${x.unit||''}`],['位置',x.location],['开始使用',x.startedAt||'未记录'],['回购',x.repurchase||'未决定'],['评分',stars(x.rating)],['备注',x.review||'未记录']];detailRows.innerHTML=rows.map(r=>`<div class="detailrow"><span>${r[0]}</span><span>${r[1]||'—'}</span></div>`).join('');modal.classList.add('show')}
function render(){renderStats();filters.style.display=['inventory','shopping','nobuy'].includes(tab)?'grid':'none';({inventory:()=>inventory(),shopping:()=>inventory('shopping'),prices,ledger,nobuy:noBuy,review}[tab])()}
document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});q.oninput=render;cat.onchange=render;status.onchange=render;closeBtn.onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};load()})
</script></body></html>
